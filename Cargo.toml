[workspace]
resolver = "2"
members = [
    "crates/symbol-core",
    "crates/ngram-trie",
    "crates/symbol-dict",
    "crates/megahal-markov",
    "crates/megahal-tokenizer",
    "crates/megahal-keywords",
    "crates/megahal-gen",
    "crates/megahal",
    "crates/megahal-cli",
]

[workspace.package]
edition = "2024"
version = "0.3.0"
rust-version = "1.88"
license = "MIT"
authors = ["Tony Gies <tgies@tgies.net>"]
repository = "https://github.com/tgies/megahal-rs"
publish = true

[workspace.dependencies]
symbol-core = { path = "crates/symbol-core", version = "0.3.0" }
ngram-trie = { path = "crates/ngram-trie", version = "0.3.0" }
symbol-dict = { path = "crates/symbol-dict", version = "0.3.0" }
megahal-markov = { path = "crates/megahal-markov", version = "0.3.0" }
megahal-tokenizer = { path = "crates/megahal-tokenizer", version = "0.3.0" }
megahal-keywords = { path = "crates/megahal-keywords", version = "0.3.0" }
megahal-gen = { path = "crates/megahal-gen", version = "0.3.0" }
megahal = { path = "crates/megahal", version = "0.3.0" }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
similar_names = "allow"
many_single_char_names = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
