# Configuration for cargo-mutants: https://mutants.rs/config-file.html

# Exclude specific files/directories from mutation
exclude_globs = [
    "**/build.rs",
]

# Exclude specific patterns (e.g. Debug/Display formatters or test modules)
exclude_re = [
    "impl Debug",
    "impl Display",
    "<impl Clone for .*>::clone",
]
