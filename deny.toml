[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode flagged unmaintained for non-technical reasons; 2.0.1 is feature-complete and used only for the (non-security-critical) brain serialization format" },
]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "0BSD",
    "ISC", "Unlicense", "Zlib", "MIT-0", "CC0-1.0", "Unicode-3.0",
]
confidence-threshold = 0.8

exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
