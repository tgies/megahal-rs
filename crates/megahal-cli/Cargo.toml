[package]
name = "megahal-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "MegaHAL CLI - a conversational chatbot using bidirectional Markov chains."
keywords = ["chatbot", "megahal", "cli"]
categories = ["command-line-utilities"]
readme = "../../README.md"
# tests/cli.rs depends on workspace-level data/ fixtures not packaged in
# the published crate.
exclude = ["tests/cli.rs"]

[[bin]]
name = "megahal"
path = "src/main.rs"
doc = false

# cargo-binstall metadata. Asset names follow the houseabsolute/actions-rust-release
# convention used by .github/workflows/release.yml.
[package.metadata.binstall]
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/megahal-Linux-musl-x86_64.tar.gz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/megahal-Linux-musl-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/megahal-Linux-musl-arm64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/megahal-Linux-musl-arm64.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/megahal-macOS-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/megahal-macOS-arm64.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/megahal-Windows-msvc-x86_64.zip"
pkg-fmt = "zip"

[dependencies]
megahal.workspace = true
rand.workspace = true
clap = { version = "4", features = ["derive"] }
dirs = "6"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints]
workspace = true
